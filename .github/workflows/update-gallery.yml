name: Update Gallery

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "Immagini/**"
      - "scripts/generate-gallery.ps1"
      - ".github/workflows/update-gallery.yml"

permissions:
  contents: write

jobs:
  update-gallery:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate gallery.json
        shell: pwsh
        run: ./scripts/generate-gallery.ps1

      - name: Commit updated gallery
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery.json gallery-data.js
          git diff --cached --quiet && exit 0
          git commit -m "chore: update gallery"
          git push
